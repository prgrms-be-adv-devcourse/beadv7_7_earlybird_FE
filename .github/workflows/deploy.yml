name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys touch a shared container on EC2 - never let two runs race each other.
concurrency:
  group: fe-deploy
  cancel-in-progress: false

env:
  # Hardcoded lowercase - `github.repository` preserves the repo's actual casing
  # (...beadv7_7_earlybird_FE), but Docker/GHCR image names must be all lowercase.
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_fe

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Pull and restart fe on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml pull fe
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d fe
